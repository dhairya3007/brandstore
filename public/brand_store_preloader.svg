<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Brand Store Anand animated preloader</title>
  <desc id="desc">A black and gold luxury menswear splash screen with an animated circular monogram, brand name, and loading line.</desc>
  <defs>
    <radialGradient id="bgGlow">
      <stop offset="0" stop-color="#241a08" stop-opacity=".48"/>
      <stop offset=".58" stop-color="#090806" stop-opacity=".2"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b4"/>
      <stop offset=".24" stop-color="#c99a42"/>
      <stop offset=".52" stop-color="#ffe9a0"/>
      <stop offset=".76" stop-color="#9a6d24"/>
      <stop offset="1" stop-color="#f7d77e"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c7c7c7"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <path id="outerArc" d="M 470 590 A 340 340 0 1 1 1128 420"/>
    <path id="taglineArc" d="M 650 622 A 180 180 0 0 0 950 622"/>
  </defs>
  <rect width="1600" height="900" fill="#050505"/>
  <ellipse cx="800" cy="415" rx="470" ry="440" fill="url(#bgGlow)"/>
  <circle cx="800" cy="410" r="365" fill="#d6a94d" opacity=".06" filter="url(#softGlow)"/>

  <g transform="translate(0 -5)">
    <!-- Decorative orbit -->
    <circle cx="800" cy="405" r="355" fill="none" stroke="#6f5221" stroke-width="1" opacity=".24"/>
    <circle cx="800" cy="405" r="338" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".65" stroke-dasharray="2 13" class="orbit"/>
    <circle cx="800" cy="405" r="320" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity=".75"/>
    <circle cx="800" cy="405" r="307" fill="none" stroke="#d5b56b" stroke-width="1.2" opacity=".65"/>

    <!-- Animated ring strokes -->
    <circle cx="800" cy="405" r="338" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="790 1500" class="draw-ring"/>
    <circle cx="800" cy="405" r="320" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray="420 1600" class="shine-ring" filter="url(#glow)"/>

    <!-- Orbit highlights -->
    <circle cx="486" cy="575" r="4" fill="#ffe7a0" filter="url(#glow)" class="spark spark-a"/>
    <circle cx="1104" cy="275" r="4" fill="#ffe7a0" filter="url(#glow)" class="spark spark-b"/>
    <circle cx="1060" cy="614" r="3" fill="#d7b56d" class="spark spark-c"/>
    <circle cx="590" cy="112" r="2.5" fill="#fff0b4" class="spark spark-d"/>

    <!-- Hanger motif -->
    <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" class="hanger">
      <path d="M800 163 C800 151 811 144 821 151 C832 158 829 171 818 178 C812 182 810 187 810 195" stroke-width="3.5"/>
      <path d="M810 195 L702 247 L898 247 Q914 247 920 262" stroke-width="3.2"/>
    </g>

    <!-- Monogram -->
    <g class="monogram">
      <text x="750" y="418" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="205" fill="url(#gold)" stroke="#7c5921" stroke-width="1">B</text>
      <text x="847" y="421" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="184" font-style="italic" fill="url(#silver)" stroke="#7a7a7a" stroke-width=".8">S</text>
    </g>

    <!-- Wordmark -->
    <text x="800" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="10" fill="#fff" class="brand">BRAND</text>
    <path d="M652 528 H724 M876 528 H948" stroke="url(#gold)" stroke-width="2.5"/>
    <text x="800" y="543" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="15" fill="url(#gold)" class="store">STORE</text>

    <!-- Minimal shirt icon -->
    <g transform="translate(780 559)" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round">
      <path d="M10 0 L20 5 L31 0 L43 10 L36 19 L30 15 L30 39 L-1 39 L-1 15 L-7 19 L-14 10 L-2 0 L8 5 Z" transform="translate(0 0) scale(.72)"/>
    </g>
    <path d="M677 585 H759 M841 585 H923" stroke="url(#gold)" stroke-width="1.5" opacity=".9"/>
    <text x="800" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="6" fill="#eee" class="tagline">PREMIUM MENSWEAR</text>
  </g>

  <!-- Loading indicator -->
  <g transform="translate(550 796)">
    <rect width="500" height="5" rx="2.5" fill="#393632"/>
    <rect width="500" height="5" rx="2.5" fill="url(#gold)" class="progress"/>
    <circle cx="0" cy="2.5" r="5" fill="#ffe6a0" filter="url(#glow)" class="progress-dot"/>
  </g>

  <style>
    .draw-ring { stroke-dashoffset: 2290; animation: draw 1.7s cubic-bezier(.22,.7,.2,1) forwards; }
    .shine-ring { animation: sweep 3.8s ease-in-out infinite alternate; transform-origin: 800px 405px; }
    .orbit { transform-origin: 800px 405px; animation: orbit 24s linear infinite; }
    .monogram { opacity: 0; transform-origin: 800px 350px; animation: reveal .9s ease-out .45s forwards; }
    .brand, .store, .tagline { opacity: 0; animation: rise .7s ease-out forwards; }
    .brand { animation-delay: .8s; }
    .store { animation-delay: 1s; }
    .tagline { animation-delay: 1.2s; }
    .hanger { stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw 1s ease-out .15s forwards; }
    .spark-a { animation: twinkle 2.2s ease-in-out infinite; }
    .spark-b { animation: twinkle 2.5s ease-in-out .4s infinite; }
    .spark-c { animation: twinkle 2.7s ease-in-out .8s infinite; }
    .spark-d { animation: twinkle 2.3s ease-in-out .2s infinite; }
    .progress { transform-origin: left center; animation: load 2.8s cubic-bezier(.35,.05,.25,1) infinite; }
    .progress-dot { animation: dot 2.8s cubic-bezier(.35,.05,.25,1) infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes reveal { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sweep { from { stroke-dashoffset: 250; opacity: .45; } to { stroke-dashoffset: -250; opacity: 1; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes load { 0% { transform: scaleX(.08); } 70% { transform: scaleX(.78); } 100% { transform: scaleX(1); } }
    @keyframes dot { 0% { transform: translateX(0); } 70% { transform: translateX(390px); } 100% { transform: translateX(495px); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .draw-ring, .hanger { stroke-dashoffset: 0; }
      .monogram, .brand, .store, .tagline { opacity: 1; }
      .progress { transform: scaleX(.75); }
    }
  </style>
</svg>
